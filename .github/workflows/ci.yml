name: CI

on:
  push:
    branches: [ "main" ]
  # PRs and manual runs are a dry run: tests, version, and image build, but no
  # login, push, or tag.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.168.0

jobs:
  hugo:
    name: Hugo Build & Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      # Shortcode errorf calls (e.g. missing images) fail the build here.
      # baseURL "/" keeps links relative so the link check can resolve them on disk.
      - name: Build
        run: hugo --gc --baseURL / --printPathWarnings

      - name: Check expected pages
        run: |
          for f in index.html 404.html sitemap.xml index.xml about/index.html posts/index.html tags/index.html; do
            test -s "public/$f" || { echo "::error::missing or empty public/$f"; exit 1; }
          done

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/public --index-files index.html 'public/**/*.html'
          lycheeVersion: v0.24.2
          fail: true

  get_semver:
    name: Create SemVer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}

  build_and_publish_image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - hugo
      - get_semver
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/jakobottar/jakobjdev:${{ needs.get_semver.outputs.semVer }}
            ghcr.io/jakobottar/jakobjdev:stable

  create_tag:
    name: Push GitHub Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - get_semver
      - build_and_publish_image
    permissions:
      contents: write
    steps:
      - name: Create Tag
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{ needs.get_semver.outputs.semVer }}",
              sha: context.sha
            })
